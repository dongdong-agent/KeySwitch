<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.65" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keyGrad" x1="0" y1="193" x2="0" y2="831" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.45" stop-color="#FFD34E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景：紫主题圆角方块 -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#glow)"/>

  <!-- 金色钥匙（垂直：圆环手柄在上，齿在下） -->
  <g filter="url(#shadow)" fill="url(#keyGrad)">
    <!-- 手柄圆环（外圆 + 内孔） -->
    <path fill-rule="evenodd" d="M 512 193
      a 185 185 0 1 0 0.001 0 Z
      M 512 298
      a 80 80 0 1 1 -0.001 0 Z"/>
    <!-- 匙杆 -->
    <rect x="464" y="546" width="96" height="285" rx="10"/>
    <!-- 上齿 -->
    <rect x="560" y="690" width="160" height="56" rx="10"/>
    <!-- 下齿 -->
    <rect x="560" y="774" width="110" height="57" rx="10"/>
  </g>
</svg>
