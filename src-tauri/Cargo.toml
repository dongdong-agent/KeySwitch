[package]
name = "apikey-switcher-rust"
version = "0.3.1"
description = "KeySwitch - API Key 管理器（每软件独立配置 + 智能切换）"
authors = ["Dongdong"]
edition = "2021"

[lib]
name = "apikey_switcher_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
regex = "1"
ureq = { version = "2", features = ["json"] }
